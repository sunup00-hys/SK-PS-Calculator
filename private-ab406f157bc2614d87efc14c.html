 function mount(){
  token=to64(crypto.getRandomValues(new Uint8Array(24)));
  const initial=JSON.stringify({token,values:state.values}).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  const bridge=`<script>(function(){const seed=${initial};const values=new Map(Object.entries(seed.values));const send=()=>parent.postMessage({type:'ps-vault-save',token:seed.token,values:Object.fromEntries(values)},'*');const storage={getItem:key=>values.has(String(key))?values.get(String(key)):null,setItem:(key,value)=>{key=String(key);if(!key.startsWith('hynix_ps_'))return;values.set(key,String(value));send();},removeItem:key=>{values.delete(String(key));send();},clear:()=>{values.clear();send();},key:index=>[...values.keys()][index]??null,get length(){return values.size;}};Object.defineProperty(window,'localStorage',{value:storage});let last=0;for(const name of ['keydown','pointerdown','input','touchstart'])document.addEventListener(name,()=>{const now=Date.now();if(now-last>1000){last=now;parent.postMessage({type:'ps-vault-activity',token:seed.token},'*');}},{passive:true});})();<\/script>`;
  frame=byId('app');frame.srcdoc=html.replace(/<head([^>]*)>/i,(match)=>match+bridge);
  byId('gate').hidden=true;byId('workspace').hidden=false;document.title='개인 계산기';idleAt=Date.now();
 }
 async function unlock(event){
  event.preventDefault();byId('unlock').disabled=true;byId('gateError').textContent='비밀번호 확인 중…';
  let decrypted=false;
  try{
   if(!crypto.subtle)throw new Error('crypto-unavailable');
   const candidate=await derive(byId('password').value),source=await decrypt(config,'ps-app-v1',candidate);decrypted=true;
   const existing=localStorage.getItem(keyName);
   if(existing){const envelope=JSON.parse(existing);if(envelope.id!==config.id)throw new Error('vault');const data=await decodeStoredState(envelope,candidate);state={values:cleanValues(data.values),legacyBackups:Array.isArray(data.legacyBackups)?data.legacyBackups:[],referenceRevision:String(data.referenceRevision||'')};}
   else state={values:{},legacyBackups:[],referenceRevision:''};
   key=candidate;html=source;byId('password').value='';await migrate();await applyReferencePatch();byId('gateError').textContent='';mount();
  }catch(error){key=null;html='';state={values:{},legacyBackups:[],referenceRevision:''};byId('gateError').textContent=decrypted?'저장 데이터를 열거나 저장할 수 없습니다. 기존 데이터는 삭제하지 않았습니다.':'비밀번호를 확인해 주세요.';}
  finally{byId('unlock').disabled=false;}
 }
 window.addEventListener('message',event=>{
  if(!key||!frame||event.source!==frame.contentWindow||event.data?.token!==token)return;
  idleAt=Date.now();
  if(event.data.type==='ps-vault-save'){state.values=cleanValues(event.data.values);save().catch(()=>{});}
 });
 async function lock(){
  if(!key)return;
  try{await save();}catch(error){return;}
  if(frame){frame.removeAttribute('srcdoc');frame.src='about:blank';}
  key=null;html='';token='';state={values:{},legacyBackups:[],referenceRevision:''};frame=null;
  byId('workspace').hidden=true;byId('gate').hidden=false;byId('password').value='';byId('gateError').textContent='잠겼습니다. 비밀번호를 다시 입력하세요.';document.title='개인 계산기 · 잠금';
 }
 byId('unlockForm').addEventListener('submit',unlock);byId('lock').addEventListener('click',lock);
 byId('backup').addEventListener('click',async()=>{
  try{await save();const contents=localStorage.getItem(keyName);const url=URL.createObjectURL(new Blob([contents],{type:'application/json'}));const anchor=document.createElement('a');anchor.href=url;anchor.download='private-calculator-encrypted-backup.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(error){}
 });
 byId('restore').addEventListener('click',()=>byId('restoreFile').click());
 byId('restoreFile').addEventListener('change',async()=>{
  const file=byId('restoreFile').files[0];if(!file||!key)return;
  try{const envelope=JSON.parse(await file.text());if(envelope.id!==config.id)throw new Error('other-vault');const restored=await decodeStoredState(envelope,key);if(!restored.values||typeof restored.values!=='object')throw new Error('format');if(!confirm('현재 입력값을 이 백업의 입력값으로 바꿀까요?'))return;
   state.legacyBackups.push({time:new Date().toISOString(),values:state.values});state.values=cleanValues(restored.values);state.referenceRevision=String(restored.referenceRevision||'');await applyReferencePatch();await save();mount();
  }catch(error){alert('이 계산기의 올바른 암호화 백업인지 확인해 주세요. 현재 입력값은 유지됩니다.');}
  finally{byId('restoreFile').value='';}
 });
 for(const name of ['pointerdown','keydown'])document.addEventListener(name,()=>idleAt=Date.now(),{passive:true});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>5*60*1000)lock();});
 setInterval(()=>{if(key&&Date.now()-idleAt>15*60*1000)lock();},15000);
})();
</script></body></html>
