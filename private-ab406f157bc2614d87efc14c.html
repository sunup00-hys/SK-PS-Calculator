 async function applyInsurancePatch(){

 byId('unlockForm').addEventListener('submit',unlock);byId('lock').addEventListener('click',lock);
 byId('backup').addEventListener('click',async()=>{
  try{await save();const contents=localStorage.getItem(keyName);const url=URL.createObjectURL(new Blob([contents],{type:'application/json'}));const anchor=document.createElement('a');anchor.href=url;anchor.download='private-calculator-encrypted-backup.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(error){}
 });
 byId('restore').addEventListener('click',()=>byId('restoreFile').click());
 byId('restoreFile').addEventListener('change',async()=>{
  const file=byId('restoreFile').files[0];if(!file||!key)return;
  try{const envelope=JSON.parse(await file.text());if(envelope.id!==config.id)throw new Error('other-vault');const restored=await decodeStoredState(envelope,key);if(!restored.values||typeof restored.values!=='object')throw new Error('format');if(!confirm('현재 입력값을 이 백업의 입력값으로 바꿀까요?'))return;
   state.legacyBackups.push({time:new Date().toISOString(),values:state.values});state.values=cleanValues(restored.values);state.referenceRevision=String(restored.referenceRevision||'');await applyReferencePatch();await applyInsurancePatch();await applyVenturePatch();await applyInclusionPatch();await save();mount();
  }catch(error){alert('이 계산기의 올바른 암호화 백업인지 확인해 주세요. 현재 입력값은 유지됩니다.');}
  finally{byId('restoreFile').value='';}
 });
 resumeLogin();
})();
