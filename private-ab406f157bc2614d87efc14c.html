  const patch=JSON.parse(await decrypt(config.donationSeed,'ps-donation-seed-v1',key)),profileKey='hynix_ps_private_reference_v1',simpleKey='hynix_ps_settlement_2027_v1';

  const simple=JSON.parse(state.values[simpleKey]||'{}');if(!Array.isArray(simple.changes))simple.changes=[];
  simple.changes=simple.changes.filter(row=>!(row.kind==='credit'&&row.name==='기부금 세액공제'));
  for(const item of [{name:patch.otherName,before:patch.otherCredit,after:patch.otherCredit},{name:patch.creditName,before:patch.priorCredit,after:patch.credit}]){
   let row=simple.changes.find(row=>row.kind==='credit'&&row.name===item.name);if(!row){row={name:item.name,kind:'credit',before:item.before/1e4,after:item.after/1e4};simple.changes.push(row);}else if(item.name===patch.creditName){row.after=item.after/1e4;}
  }
  profile.donationProjection=patch;state.values[profileKey]=JSON.stringify(profile);state.values[simpleKey]=JSON.stringify(simple);await save();
 }

 function mount(){

  const initial=JSON.stringify({token,values:state.values}).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  const bridge=`<script>(function(){const seed=${initial};const values=new Map(Object.entries(seed.values));const send=()=>parent.postMessage({type:'ps-vault-save',token:seed.token,values:Object.fromEntries(values)},'*');const storage={getItem:key=>values.has(String(key))?values.get(String(key)):null,setItem:(key,value)=>{key=String(key);if(!key.startsWith('hynix_ps_'))return;values.set(key,String(value));send();},removeItem:key=>{values.delete(String(key));send();},clear:()=>{values.clear();send();},key:index=>[...values.keys()][index]??null,get length(){return values.size;}};Object.defineProperty(window,'localStorage',{value:storage});let last=0;for(const name of ['keydown','pointerdown','input','touchstart'])document.addEventListener(name,()=>{const now=Date.now();if(now-last>1000){last=now;parent.postMessage({type:'ps-vault-activity',token:seed.token},'*');}},{passive:true});})();<\/script>`;
  frame=byId('app');frame.srcdoc=html.replace(/<head([^>]*)>/i,(match)=>match+bridge);

 const loginDbName='ps-calculator-login-v1';
 function loginKeyStore(action,value){return new Promise((resolve,reject)=>{
  const request=indexedDB.open(loginDbName,1);
  request.onupgradeneeded=()=>request.result.createObjectStore('sessions');request.onerror=()=>reject(request.error);
  request.onsuccess=()=>{const db=request.result,tx=db.transaction('sessions',action==='get'?'readonly':'readwrite'),store=tx.objectStore('sessions');let result;
   const op=action==='get'?store.get(config.id):action==='put'?store.put(value,config.id):store.delete(config.id);
   op.onsuccess=()=>{result=op.result;};tx.oncomplete=()=>{db.close();resolve(result);};tx.onerror=()=>{db.close();reject(tx.error);};tx.onabort=()=>{db.close();reject(tx.error);};
  };
 });}
 async function openWithKey(candidate){
  const source=await decrypt(config,'ps-app-v1',candidate),existing=localStorage.getItem(keyName);

  else state={values:{},legacyBackups:[],referenceRevision:''};
  key=candidate;html=source;byId('password').value='';await migrate();await applyReferencePatch();await applyInsurancePatch();await applyVenturePatch();await applyInclusionPatch();await applyDonationPatch();await applyHealthProjectionPatch();await applyHealthHistoryPatch();await applyHealthCompensationPatch();await applyHealthPiPatch();byId('gateError').textContent='';mount();
