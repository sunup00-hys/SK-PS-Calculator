(function(){
 'use strict';
 const config=JSON.parse(document.getElementById('vaultPayload').textContent);
 const byId=id=>document.getElementById(id),encoder=new TextEncoder(),decoder=new TextDecoder();
 const from64=text=>Uint8Array.from(atob(text),c=>c.charCodeAt(0));
 const to64=bytes=>{let out='';for(let i=0;i<bytes.length;i+=8192)out+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(out);};
 const keyName='ps_private_vault_'+config.id;
 const allowed=key=>typeof key==='string'&&key.startsWith('hynix_ps_');
 const cleanValues=values=>Object.fromEntries(Object.entries(values||{}).filter(([key,value])=>allowed(key)&&typeof value==='string'));
 let key=null,html='',state={values:{},legacyBackups:[],referenceRevision:''},frame=null,token='',saveQueue=Promise.resolve(),idleAt=Date.now(),hiddenAt=0;
 async function derive(password){const raw=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:from64(config.salt),iterations:config.iterations,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}

 async function decodeStoredState(envelope,currentKey){
  try{return JSON.parse(await decrypt(envelope,'ps-data-v1',currentKey));}catch(currentError){
   for(const recovery of config.recoveryKeys||[]){
    try{
     const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(recovery.iv),additionalData:encoder.encode('ps-keyring-v1')},currentKey,from64(recovery.cipher));
     const previous=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);

 async function encrypt(value,currentKey){const iv=crypto.getRandomValues(new Uint8Array(12));const cipher=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:encoder.encode('ps-data-v1')},currentKey,encoder.encode(value)));return {version:1,id:config.id,iv:to64(iv),cipher:to64(cipher)};}
 function save(){
  const snapshot=JSON.stringify(state),currentKey=key;
  saveQueue=saveQueue.catch(()=>{}).then(async()=>{
   const envelope=await encrypt(snapshot,currentKey),serialized=JSON.stringify(envelope);
   localStorage.setItem(keyName,serialized);
   if(localStorage.getItem(keyName)!==serialized)throw new Error('storage');
   byId('vaultStatus').textContent='이 브라우저에 암호화 저장됨';
  });
  return saveQueue.catch(error=>{byId('vaultStatus').textContent='저장 실패 · 잠그기 전에 암호화 백업을 받으세요';throw error;});
 }
 function legacyValues(){const data={};for(let i=0;i<localStorage.length;i++){const name=localStorage.key(i);if(allowed(name))data[name]=localStorage.getItem(name);}return data;}
 async function migrate(){
  const legacy=legacyValues(),conflicts={};
  for(const [name,value]of Object.entries(legacy)){
   if(state.values[name]===undefined)state.values[name]=value;
   else if(state.values[name]!==value)conflicts[name]=value;
  }
  if(Object.keys(conflicts).length)state.legacyBackups.push({time:new Date().toISOString(),values:conflicts});
  await save();
  // Delete only this calculator's old plaintext values, after the encrypted copy is committed.
  for(const [name,value]of Object.entries(legacy))if(localStorage.getItem(name)===value)localStorage.removeItem(name);
 }
 async function applyReferencePatch(){
  if(!config.referenceSeed)return;
  const patch=JSON.parse(await decrypt(config.referenceSeed,'ps-reference-seed-v1',key));
  if(state.referenceRevision===patch.revision)return;
  const read=name=>{try{return JSON.parse(state.values[name]||'{}')||{};}catch(error){return {};}};
  const auxKey='hynix_ps_finance_aux_v5_profit_income_alignment',simpleKey='hynix_ps_settlement_2027_v1',monthlyKey='hynix_ps_monthly_withholding_v1';
  const aux=read(auxKey);Object.assign(aux,patch.aux);state.values[auxKey]=JSON.stringify(aux);
  const simple=read(simpleKey),oldChanges=Array.isArray(simple.changes)?simple.changes:[];
  simple.inputs={...(simple.inputs||{}),...patch.inputs};
  simple.changes=patch.changes.map(row=>{const old=oldChanges.find(item=>item.name===row.name&&item.kind===row.kind);return {...row,after:old&&Number.isFinite(Number(old.after))?Number(old.after):row.after};});
  simple.changes.push(...oldChanges.filter(old=>!patch.changes.some(row=>row.name===old.name&&row.kind===old.kind)));
  state.values[simpleKey]=JSON.stringify(simple);
  const monthly=read(monthlyKey),year=monthly['2026']||{};
  year.rates=patch.monthly2026.rates;year.base=patch.monthly2026.base;
  year.actual=Array.isArray(year.actual)?year.actual:Array(12).fill(null);year.actual[10]=patch.monthly2026.actualNovember;
  monthly['2026']=year;state.values[monthlyKey]=JSON.stringify(monthly);
  state.values['hynix_ps_private_reference_v1']=JSON.stringify(patch.profile);
  state.referenceRevision=patch.revision;await save();
 }
 async function applyInsurancePatch(){
  if(!config.insuranceSeed)return;
  const patch=JSON.parse(await decrypt(config.insuranceSeed,'ps-insurance-seed-v1',key));
  const profileKey='hynix_ps_private_reference_v1',simpleKey='hynix_ps_settlement_2027_v1';
  const profile=JSON.parse(state.values[profileKey]||'null');if(!profile||profile.insuranceProjection?.revision===patch.revision)return;
  const simple=JSON.parse(state.values[simpleKey]||'{}');if(!Array.isArray(simple.changes))simple.changes=[];
  for(const item of patch.rows){let row=simple.changes.find(row=>row.name===item.name&&row.kind==='income');if(!row){row={name:item.name,kind:'income',before:item.before/1e4};simple.changes.push(row);}row.after=item.total/1e4;}
  profile.insuranceProjection=patch;state.values[profileKey]=JSON.stringify(profile);state.values[simpleKey]=JSON.stringify(simple);await save();
 }
 function mount(){
  token=to64(crypto.getRandomValues(new Uint8Array(24)));
  const initial=JSON.stringify({token,values:state.values}).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  const bridge=`<script>(function(){const seed=${initial};const values=new Map(Object.entries(seed.values));const send=()=>parent.postMessage({type:'ps-vault-save',token:seed.token,values:Object.fromEntries(values)},'*');const storage={getItem:key=>values.has(String(key))?values.get(String(key)):null,setItem:(key,value)=>{key=String(key);if(!key.startsWith('hynix_ps_'))return;values.set(key,String(value));send();},removeItem:key=>{values.delete(String(key));send();},clear:()=>{values.clear();send();},key:index=>[...values.keys()][index]??null,get length(){return values.size;}};Object.defineProperty(window,'localStorage',{value:storage});let last=0;for(const name of ['keydown','pointerdown','input','touchstart'])document.addEventListener(name,()=>{const now=Date.now();if(now-last>1000){last=now;parent.postMessage({type:'ps-vault-activity',token:seed.token},'*');}},{passive:true});})();<\/script>`;
  frame=byId('app');frame.srcdoc=html.replace(/<head([^>]*)>/i,(match)=>match+bridge);
  byId('gate').hidden=true;byId('workspace').hidden=false;document.title='개인 계산기';idleAt=Date.now();
 }
 async function unlock(event){
  event.preventDefault();byId('unlock').disabled=true;byId('gateError').textContent='비밀번호 확인 중…';
  let decrypted=false;
  try{
   if(!crypto.subtle)throw new Error('crypto-unavailable');
   const candidate=await derive(byId('password').value),source=await decrypt(config,'ps-app-v1',candidate);decrypted=true;
   const existing=localStorage.getItem(keyName);
   if(existing){const envelope=JSON.parse(existing);if(envelope.id!==config.id)throw new Error('vault');const data=await decodeStoredState(envelope,candidate);state={values:cleanValues(data.values),legacyBackups:Array.isArray(data.legacyBackups)?data.legacyBackups:[],referenceRevision:String(data.referenceRevision||'')};}
   else state={values:{},legacyBackups:[],referenceRevision:''};
   key=candidate;html=source;byId('password').value='';await migrate();await applyReferencePatch();await applyInsurancePatch();byId('gateError').textContent='';mount();
  }catch(error){key=null;html='';state={values:{},legacyBackups:[],referenceRevision:''};byId('gateError').textContent=decrypted?'저장 데이터를 열거나 저장할 수 없습니다. 기존 데이터는 삭제하지 않았습니다.':'비밀번호를 확인해 주세요.';}
  finally{byId('unlock').disabled=false;}
 }
 window.addEventListener('message',event=>{
  if(!key||!frame||event.source!==frame.contentWindow||event.data?.token!==token)return;
  idleAt=Date.now();
  if(event.data.type==='ps-vault-save'){state.values=cleanValues(event.data.values);save().catch(()=>{});}
 });
 async function lock(){
  if(!key)return;
  try{await save();}catch(error){return;}
  if(frame){frame.removeAttribute('srcdoc');frame.src='about:blank';}
  key=null;html='';token='';state={values:{},legacyBackups:[],referenceRevision:''};frame=null;
  byId('workspace').hidden=true;byId('gate').hidden=false;byId('password').value='';byId('gateError').textContent='잠겼습니다. 비밀번호를 다시 입력하세요.';document.title='개인 계산기 · 잠금';
 }
 byId('unlockForm').addEventListener('submit',unlock);byId('lock').addEventListener('click',lock);
 byId('backup').addEventListener('click',async()=>{
  try{await save();const contents=localStorage.getItem(keyName);const url=URL.createObjectURL(new Blob([contents],{type:'application/json'}));const anchor=document.createElement('a');anchor.href=url;anchor.download='private-calculator-encrypted-backup.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(error){}
 });
 byId('restore').addEventListener('click',()=>byId('restoreFile').click());
 byId('restoreFile').addEventListener('change',async()=>{
  const file=byId('restoreFile').files[0];if(!file||!key)return;
  try{const envelope=JSON.parse(await file.text());if(envelope.id!==config.id)throw new Error('other-vault');const restored=await decodeStoredState(envelope,key);if(!restored.values||typeof restored.values!=='object')throw new Error('format');if(!confirm('현재 입력값을 이 백업의 입력값으로 바꿀까요?'))return;
   state.legacyBackups.push({time:new Date().toISOString(),values:state.values});state.values=cleanValues(restored.values);state.referenceRevision=String(restored.referenceRevision||'');await applyReferencePatch();await applyInsurancePatch();await save();mount();
  }catch(error){alert('이 계산기의 올바른 암호화 백업인지 확인해 주세요. 현재 입력값은 유지됩니다.');}
  finally{byId('restoreFile').value='';}
 });
 for(const name of ['pointerdown','keydown'])document.addEventListener(name,()=>idleAt=Date.now(),{passive:true});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>5*60*1000)lock();});

})();
