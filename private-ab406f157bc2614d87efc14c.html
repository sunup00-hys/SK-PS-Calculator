  });

 }
 function legacyValues(){const data={};for(let i=0;i<localStorage.length;i++){const name=localStorage.key(i);if(allowed(name))data[name]=localStorage.getItem(name);}return data;}
 async function migrate(){
  const legacy=legacyValues(),conflicts={};
  for(const [name,value]of Object.entries(legacy)){
   if(state.values[name]===undefined)state.values[name]=value;
   else if(state.values[name]!==value)conflicts[name]=value;
  }
  if(Object.keys(conflicts).length)state.legacyBackups.push({time:new Date().toISOString(),values:conflicts});
  await save();

  for(const [name,value]of Object.entries(legacy))if(localStorage.getItem(name)===value)localStorage.removeItem(name);

 async function applyReferencePatch(){
  if(!config.referenceSeed)return;
  const patch=JSON.parse(await decrypt(config.referenceSeed,'ps-reference-seed-v1',key));
  if(state.referenceRevision===patch.revision)return;
  const read=name=>{try{return JSON.parse(state.values[name]||'{}')||{};}catch(error){return {};}};
  const auxKey='hynix_ps_finance_aux_v5_profit_income_alignment',simpleKey='hynix_ps_settlement_2027_v1',monthlyKey='hynix_ps_monthly_withholding_v1';
  const aux=read(auxKey);Object.assign(aux,patch.aux);state.values[auxKey]=JSON.stringify(aux);
  const simple=read(simpleKey),oldChanges=Array.isArray(simple.changes)?simple.changes:[];
  simple.inputs={...(simple.inputs||{}),...patch.inputs};
  simple.changes=patch.changes.map(row=>{const old=oldChanges.find(item=>item.name===row.name&&item.kind===row.kind);return {...row,after:old&&Number.isFinite(Number(old.after))?Number(old.after):row.after};});
  simple.changes.push(...oldChanges.filter(old=>!patch.changes.some(row=>row.name===old.name&&row.kind===old.kind)));

  const monthly=read(monthlyKey),year=monthly['2026']||{};
  year.rates=patch.monthly2026.rates;year.base=patch.monthly2026.base;
  year.actual=Array.isArray(year.actual)?year.actual:Array(12).fill(null);year.actual[10]=patch.monthly2026.actualNovember;
  monthly['2026']=year;state.values[monthlyKey]=JSON.stringify(monthly);

 async function applyInsurancePatch(){
  if(!config.insuranceSeed)return;
  const patch=JSON.parse(await decrypt(config.insuranceSeed,'ps-insurance-seed-v1',key));
  const profileKey='hynix_ps_private_reference_v1',simpleKey='hynix_ps_settlement_2027_v1';
  const profile=JSON.parse(state.values[profileKey]||'null');if(!profile||profile.insuranceProjection?.revision===patch.revision)return;
  const simple=JSON.parse(state.values[simpleKey]||'{}');if(!Array.isArray(simple.changes))simple.changes=[];
  for(const item of patch.rows){let row=simple.changes.find(row=>row.name===item.name&&row.kind==='income');if(!row){row={name:item.name,kind:'income',before:item.before/1e4};simple.changes.push(row);}row.after=item.total/1e4;}

 function mount(){

  const bridge=`<script>(function(){const seed=${initial};const values=new Map(Object.entries(seed.values));const send=()=>parent.postMessage({type:'ps-vault-save',token:seed.token,values:Object.fromEntries(values)},'*');const storage={getItem:key=>values.has(String(key))?values.get(String(key)):null,setItem:(key,value)=>{key=String(key);if(!key.startsWith('hynix_ps_'))return;values.set(key,String(value));send();},removeItem:key=>{values.delete(String(key));send();},clear:()=>{values.clear();send();},key:index=>[...values.keys()][index]??null,get length(){return values.size;}};Object.defineProperty(window,'localStorage',{value:storage});let last=0;for(const name of ['keydown','pointerdown','input','touchstart'])document.addEventListener(name,()=>{const now=Date.now();if(now-last>1000){last=now;parent.postMessage({type:'ps-vault-activity',token:seed.token},'*');}},{passive:true});})();<\/script>`;
  frame=byId('app');frame.srcdoc=html.replace(/<head([^>]*)>/i,(match)=>match+bridge);
  byId('gate').hidden=true;byId('workspace').hidden=false;document.title='개인 계산기';

 const loginDbName='ps-calculator-login-v1';
 function loginKeyStore(action,value){return new Promise((resolve,reject)=>{
  const request=indexedDB.open(loginDbName,1);
  request.onupgradeneeded=()=>request.result.createObjectStore('sessions');request.onerror=()=>reject(request.error);
  request.onsuccess=()=>{const db=request.result,tx=db.transaction('sessions',action==='get'?'readonly':'readwrite'),store=tx.objectStore('sessions');let result;
   const op=action==='get'?store.get(config.id):action==='put'?store.put(value,config.id):store.delete(config.id);
   op.onsuccess=()=>{result=op.result;};tx.oncomplete=()=>{db.close();resolve(result);};tx.onerror=()=>{db.close();reject(tx.error);};tx.onabort=()=>{db.close();reject(tx.error);};
  };

 async function openWithKey(candidate){
  const source=await decrypt(config,'ps-app-v1',candidate),existing=localStorage.getItem(keyName);

  else state={values:{},legacyBackups:[],referenceRevision:''};

 async function resumeLogin(){

 async function unlock(event){

 window.addEventListener('message',event=>{
